<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Guide - Rental Bot</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Light theme */
            --bg-dark: #f8fafc;        /* page + inner list bg */
            --bg-card: #ffffff;        /* panels, popups */
            --bg-hover: #f1f5f9;       /* hover, region header */
            --text-primary: #0f172a;   /* main text */
            --text-secondary: #64748b; /* meta text */
            --accent-primary: #0284c7; /* sky-600 */
            --accent-secondary: #be185d;
            --safe: #16a34a;           /* green-600 */
            --moderate: #ca8a04;       /* amber-600 */
            --unsafe: #dc2626;         /* red-600 */
            --do-not-enter: #7f1d1d;   /* red-900 — "⛔ Do not enter" */
            --guided-only: #7c3aed;    /* violet-600 — "🧑‍🏫 Guide only" */
            --border: #e2e8f0;         /* slate-200 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-dark) 100%);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1800px;
            margin: 0 auto;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-title span {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .city-toggle {
            display: flex;
            gap: 0.5rem;
            background: var(--bg-dark);
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .city-btn {
            padding: 0.6rem 1.2rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .city-btn:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .city-btn.active {
            background: var(--accent-primary);
            color: #ffffff;
        }

        .filter-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            padding: 0.6rem 1.2rem;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .filter-toggle:hover {
            color: var(--text-primary);
            border-color: var(--accent-primary);
        }

        .filter-toggle input {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 1px;
            background: var(--border);
        }

        /* Map */
        #map {
            flex: 1;
            min-height: 0;
        }

        .leaflet-popup-content-wrapper {
            background: var(--bg-card) !important;
            border: 1px solid var(--border) !important;
            border-radius: 8px !important;
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.12) !important;
        }

        .leaflet-popup-content {
            color: var(--text-primary) !important;
            font-size: 0.9rem;
        }

        .leaflet-popup-tip {
            background: var(--bg-card) !important;
            border: 1px solid var(--border) !important;
        }

        .popup-content {
            padding: 0.5rem 0;
        }

        .popup-content p {
            margin: 0.4rem 0;
            display: flex;
            justify-content: space-between;
            gap: 1rem;
        }

        .popup-content strong {
            color: var(--accent-primary);
        }

        .popup-safety {
            margin-top: 0.6rem;
            padding-top: 0.6rem;
            border-top: 1px solid var(--border);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .leaflet-control-attribution {
            background: rgba(255, 255, 255, 0.85) !important;
            color: var(--text-secondary) !important;
            border: 1px solid var(--border) !important;
        }

        .leaflet-control-attribution a {
            color: var(--accent-primary) !important;
        }

        /* Side Panel */
        .side-panel {
            width: 40%;
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .district-count {
            font-size: 1.4rem;
            color: var(--accent-primary);
            margin-top: 0.3rem;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        /* Scrollbar styling */
        .panel-content::-webkit-scrollbar {
            width: 8px;
        }

        .panel-content::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        .panel-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .panel-content::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Region Accordion */
        .region-group {
            margin-bottom: 1rem;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .region-header {
            padding: 0.9rem 1.2rem;
            background: var(--bg-hover);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .region-header:hover {
            background: #0f3460cc;
        }

        .region-header.collapsed {
            border-bottom: none;
        }

        .region-toggle {
            transition: transform 0.3s ease;
            font-size: 1.2rem;
        }

        .region-header.collapsed .region-toggle {
            transform: rotate(90deg);
        }

        .region-districts {
            background: var(--bg-dark);
            max-height: 500px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .region-header.collapsed ~ .region-districts {
            max-height: 0;
        }

        .district-item {
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s ease;
            cursor: pointer;
        }

        .district-item:last-child {
            border-bottom: none;
        }

        .district-item:hover {
            background: var(--bg-hover);
        }

        .district-item.hidden {
            display: none;
        }

        .district-name {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .district-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .badge-safe {
            background: rgba(34, 197, 94, 0.2);
            color: var(--safe);
            border: 1px solid var(--safe);
        }

        .badge-moderate {
            background: rgba(234, 179, 8, 0.2);
            color: var(--moderate);
            border: 1px solid var(--moderate);
        }

        .badge-unsafe {
            background: rgba(220, 38, 38, 0.12);
            color: var(--unsafe);
            border: 1px solid var(--unsafe);
        }

        .badge-do-not-enter {
            background: rgba(127, 29, 29, 0.12);
            color: var(--do-not-enter);
            border: 1px solid var(--do-not-enter);
            font-weight: 700;
        }

        .badge-guided {
            background: rgba(124, 58, 237, 0.12);
            color: var(--guided-only);
            border: 1px solid var(--guided-only);
            font-weight: 600;
        }

        .popup-note {
            margin-top: 0.5rem;
            padding: 0.5rem 0.6rem;
            background: var(--bg-hover);
            border-left: 3px solid var(--accent-primary);
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* Legend — collapsible accordion, collapsed by default.
           Own classes (NOT .region-header): the global click handler is
           re-attached to every .region-header on each render — a shared
           class would double-toggle the legend. */
        .legend-accordion {
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .legend-header {
            padding: 0.9rem 1.2rem;
            background: var(--bg-hover);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .legend-header:hover {
            background: #0f3460cc;
        }

        .legend-toggle {
            transition: transform 0.3s ease;
            font-size: 1.2rem;
        }

        .legend-header.collapsed .legend-toggle {
            transform: rotate(90deg);
        }

        .legend-body {
            background: var(--bg-dark);
            max-height: 300px;
            overflow: hidden;
            transition: max-height 0.3s ease;
            padding: 0.8rem 1.5rem;
        }

        .legend-header.collapsed ~ .legend-body {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.5rem;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--text-primary);
        }

        /* Mobile Responsive — вариант A (Pavel, 8 Jul 2026): страница
           скроллится целиком как обычный сайт. Карта фиксированной высоты
           45vh, список районов идёт обычным потоком БЕЗ внутреннего скролла
           (раньше он был зажат в полоску между картой 60% и легендой). */
        @media (max-width: 1024px) {
            body {
                overflow: auto;
            }

            .container {
                height: auto;
                min-height: 100vh;
            }

            .main-content {
                flex-direction: column;
                overflow: visible;
                flex: none;
            }

            #map {
                flex: none;
                height: 45vh;
                min-height: 280px;
            }

            .side-panel {
                width: 100%;
                height: auto;
                overflow: visible;
                border-left: none;
                border-top: 1px solid var(--border);
            }

            .panel-content {
                flex: none;
                overflow-y: visible;
            }

            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .city-toggle, .filter-toggle {
                width: 100%;
                justify-content: center;
            }

            .city-btn {
                flex: 1;
            }
        }

        @media (max-width: 640px) {
            .header {
                padding: 0.8rem 1rem;
            }

            .header-title {
                font-size: 1.2rem;
            }

            .panel-header {
                padding: 0.8rem 1rem;
                font-size: 0.8rem;
            }

            .region-header {
                padding: 0.8rem 1rem;
                font-size: 0.9rem;
            }

            .district-item {
                padding: 0.6rem 1rem;
                font-size: 0.85rem;
            }

            .district-badge {
                padding: 0.25rem 0.6rem;
                font-size: 0.75rem;
            }

            .legend-accordion {
                font-size: 0.8rem;
            }
        }

        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
        }

        /* No data state */
        .empty-state {
            padding: 2rem 1rem;
            text-align: center;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    </style>
</head>

            </div>
        </div>
    </div>

        // Application State
        let map;
        let markers = [];
        let currentCity = 'cape-town';
        let safeFilterEnabled = false;

        // Initialize
        function init() {
            initMap();
            setupEventListeners();
            loadCity('cape-town');
        }

        // Map Initialization
        function initMap() {
            map = L.map('map').setView([cities['cape-town'].center[0], cities['cape-town'].center[1]], cities['cape-town'].zoom);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap | © CARTO',
                maxZoom: 19,
                className: 'map-tiles'
            }).addTo(map);
        }

        // Unified safety thresholds (MUST match bot code in src/bot/telegram_bot.py):
        //   Safe ≥7, Moderate 5-6, Caution ≤4
        const SAFE_THRESHOLD = 7;
        const MODERATE_THRESHOLD = 5;

        // Special advisories override score-based classification.
        const ADVISORY_META = {
            do_not_enter: {
                color: '#7f1d1d',
                label: '⛔ Do not enter',
                badgeClass: 'badge-do-not-enter',
                note: 'Extreme risk — avoid at any time of day.',
            },
            guided_only: {
                color: '#7c3aed',
                label: '🧑‍🏫 Guided visits only',
                badgeClass: 'badge-guided',
                note: 'Interesting to visit, but never on your own — use a registered guide.',
            },
        };

        // Get Safety Color
        function getSafetyColor(district) {
            if (district.advisory && ADVISORY_META[district.advisory]) {
                return ADVISORY_META[district.advisory].color;
            }
            if (district.score >= SAFE_THRESHOLD) return '#16a34a';
            if (district.score >= MODERATE_THRESHOLD) return '#ca8a04';
            return '#dc2626';
        }

        // Get Safety Label
        function getSafetyLabel(district) {
            if (district.advisory && ADVISORY_META[district.advisory]) {
                return ADVISORY_META[district.advisory].label;
            }
            if (district.score >= SAFE_THRESHOLD) return '✓ Safe';
            if (district.score >= MODERATE_THRESHOLD) return '⚠ Moderate';
            return '⚠ Caution';
        }

        // Badge CSS class for side panel
        function getBadgeClass(district) {
            if (district.advisory && ADVISORY_META[district.advisory]) {
                return ADVISORY_META[district.advisory].badgeClass;
            }
            if (district.score >= SAFE_THRESHOLD) return 'badge-safe';
            if (district.score >= MODERATE_THRESHOLD) return 'badge-moderate';
            return 'badge-unsafe';
        }

        // Is this district "safe" for the "Show safe only" filter?
        // Advisory zones are NEVER safe, regardless of score.
        function isSafe(district) {
            if (district.advisory) return false;
            return district.score >= SAFE_THRESHOLD;
        }

        // Load City
        function loadCity(cityKey) {
            currentCity = cityKey;
            const cityData = cities[cityKey];

            // Clear existing markers
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            // Recenter map
            map.setView(cityData.center, cityData.zoom);

            // Add markers for all districts
            let visibleCount = 0;
            for (const [regionKey, region] of Object.entries(cityData.regions)) {
                region.districts.forEach(district => {
                    const safe = isSafe(district);
                    const shouldShow = !safeFilterEnabled || safe;

                    if (shouldShow) {
                        visibleCount++;
                    }

                    const color = getSafetyColor(district);
                    const label = getSafetyLabel(district);
                    const advisoryNote = district.advisory && ADVISORY_META[district.advisory]
                        ? ADVISORY_META[district.advisory].note
                        : null;
                    // Advisory zones use a larger, more emphatic marker.
                    const radius = district.advisory ? 22 : 8;

                    const marker = L.circleMarker([district.lat, district.lng], {
                        radius,
                        fillColor: color,
                        color: district.advisory ? color : '#fff',
                        weight: district.advisory ? 3 : 2,
                        opacity: shouldShow ? 1 : 0.3,
                        fillOpacity: shouldShow ? 0.8 : 0.2,
                        className: shouldShow ? '' : 'hidden-marker'
                    }).addTo(map);

                    const scoreLine = district.advisory
                        ? ''
                        : `<p>Score: <strong>${district.score}/10</strong></p>`;
                    const noteLine = advisoryNote
                        ? `<p class="popup-note">${advisoryNote}</p>`
                        : '';
                    const popupContent = `
                        <div class="popup-content">
                            <p><strong>${district.name}</strong></p>
                            <p>Region: <strong>${region.name}</strong></p>
                            ${scoreLine}
                            <div class="popup-safety" style="color: ${color};">
                                ${label}
                            </div>
                            ${noteLine}
                        </div>
                    `;

                    marker.bindPopup(popupContent);
                    marker.addEventListener('click', () => {
                        highlightDistrict(regionKey, district.name);
                    });

                    markers.push(marker);
                    marker.cityKey = cityKey;
                    marker.regionKey = regionKey;
                    marker.districtName = district.name;
                    marker.shouldShow = shouldShow;
                });
            }

            updatePanelContent();
            updateDistrictCount();
        }

        // Update Panel Content
        function updatePanelContent() {
            const cityData = cities[currentCity];
            const panelContent = document.getElementById('panelContent');
            let html = '';

            for (const [regionKey, region] of Object.entries(cityData.regions)) {
                html += `<div class="region-group">
                    <div class="region-header" data-region="${regionKey}">
                        <span>${region.emoji} ${region.name}</span>
                        <span class="region-toggle">▶</span>
                    </div>
                    <div class="region-districts">`;

                region.districts.forEach(district => {
                    const safe = isSafe(district);
                    const shouldShow = !safeFilterEnabled || safe;
                    const label = getSafetyLabel(district);
                    const badgeClass = getBadgeClass(district);

                    const hiddenClass = shouldShow ? '' : 'hidden';
                    // Advisory districts don't have a score shown — just the label.
                    const badgeText = district.advisory
                        ? label
                        : `${district.score}/10 • ${label}`;
                    html += `<div class="district-item ${hiddenClass}" data-district="${district.name}" data-region="${regionKey}">
                        <span class="district-name">${district.name}</span>
                        <span class="district-badge ${badgeClass}">
                            ${badgeText}
                        </span>
                    </div>`;
                });

                html += `</div></div>`;
            }

            panelContent.innerHTML = html;

            // Attach event listeners
            document.querySelectorAll('.region-header').forEach(header => {
                header.addEventListener('click', () => {
                    header.classList.toggle('collapsed');
                });
            });

            document.querySelectorAll('.district-item').forEach(item => {
                item.addEventListener('click', () => {
                    const regionKey = item.dataset.region;
                    const districtName = item.dataset.district;
                    highlightDistrict(regionKey, districtName);
                });
            });
        }

        // Highlight District
        function highlightDistrict(regionKey, districtName) {
            const district = cities[currentCity].regions[regionKey].districts.find(d => d.name === districtName);
            if (district) {
                map.setView([district.lat, district.lng], 13);

                const marker = markers.find(m => m.districtName === districtName && m.regionKey === regionKey);
                if (marker) {
                    marker.openPopup();
                }
            }
        }

        // Update District Count
        function updateDistrictCount() {
            const cityData = cities[currentCity];
            let count = 0;

            for (const region of Object.values(cityData.regions)) {
                for (const district of region.districts) {
                    if (!safeFilterEnabled || isSafe(district)) {
                        count++;
                    }
                }
            }

            document.getElementById('districtCount').textContent = `${count} district${count !== 1 ? 's' : ''}`;
        }

        // Event Listeners
        function setupEventListeners() {
            // City Toggle
            document.querySelectorAll('.city-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadCity(btn.dataset.city);
                });
            });

            // Safe Filter
            document.getElementById('safeFilter').addEventListener('change', (e) => {
                safeFilterEnabled = e.target.checked;

                // Update markers visibility
                markers.forEach(marker => {
                    const cityData = cities[marker.cityKey];
                    const region = cityData.regions[marker.regionKey];
                    const district = region.districts.find(d => d.name === marker.districtName);

                    if (district) {
                        const shouldShow = !safeFilterEnabled || isSafe(district);

                        if (shouldShow) {
                            marker.setOpacity(0.8);
                            marker.setStyle({ weight: district.advisory ? 3 : 2 });
                        } else {
                            marker.setOpacity(0.2);
                            marker.setStyle({ weight: 1 });
                        }
                    }
                });

                // Update panel content
                updatePanelContent();
                updateDistrictCount();
            });
        }

        // Start Application
        init();
    </script>
